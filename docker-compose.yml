services:
  postgres:
    image: postgres:16
    container_name: finance-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Admin@123}
      POSTGRES_DB: ${POSTGRES_DB:-finance_assistant}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-finance_assistant}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - finance-network

  backend:
    build: ./backend
    container_name: finance-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD_URL:-Admin%40123}@postgres:5432/${POSTGRES_DB:-finance_assistant}
    volumes:
      - ./backend:/app
      - chroma_data:/app/chroma_db
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - finance-network

  frontend:
    build: ./frontend
    container_name: finance-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_BACKEND_URL=http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - finance-network

networks:
  finance-network:
    driver: bridge

volumes:
  postgres_data:
  chroma_data:

